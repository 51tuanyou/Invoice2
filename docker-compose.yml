version: '3.8'

services:
  invoice-ocr-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      # Uncomment and set your OpenAI API key here, or pass it via docker run -e
      # - REACT_APP_OPENAI_API_KEY=your_api_key_here
    restart: unless-stopped
    container_name: invoice-ocr-frontend
